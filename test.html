<!DOCTYPE html>
<html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Matematický test</title>
<style>
:root{--card:#fff;--ink:#17324d;--muted:#60758a;--primary:#2d78d4;--line:#cbdced;--ok:#288257}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(#eef6ff,#fbfdff);color:var(--ink);overscroll-behavior:none}body{padding:20px}.wrap{max-width:1100px;margin:auto}
header,.panel{background:#fff;border-radius:26px;padding:26px;box-shadow:0 10px 28px rgba(34,76,120,.12)}header{margin-bottom:20px}h1{margin:0;font-size:clamp(34px,5vw,52px)}.subtitle{margin-top:8px;color:var(--muted);font-size:21px}
.students{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.student{min-height:180px;border:0;border-radius:26px;background:#fff;box-shadow:0 10px 28px rgba(34,76,120,.11);font-size:34px;font-weight:900;color:var(--ink);padding:20px}.student small{display:block;margin-top:12px;color:var(--muted);font-size:17px}
.teacher-actions,.actions{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap}.results-btn,.home-btn,.back,.actions button{border:0;border-radius:17px;min-height:56px;padding:0 22px;font-size:19px;font-weight:900}.results-btn{background:#17324d;color:#fff}.home-btn,.back,.secondary{background:#e8f1fb;color:var(--ink)}.primary{background:var(--primary);color:#fff}
.panel{display:none}.qr{text-align:center}.qr h2{font-size:42px}.qr p{font-size:21px;color:var(--muted)}.qr img{width:min(62vw,420px);padding:12px;background:#fff;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.13)}.url{word-break:break-all;color:var(--muted);font-size:15px}
.results-list{display:grid;gap:14px;margin-top:20px}.result-row{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:12px;padding:18px;border:2px solid var(--line);border-radius:18px;font-size:20px}.result-row strong{font-size:24px}.result-status{margin:16px 0;color:var(--muted)}
.test-header{display:flex;gap:14px;align-items:center}.progress-wrap{flex:1;height:18px;background:#e5eef8;border-radius:99px;overflow:hidden}.progress{height:100%;background:var(--primary)}.counter{font-weight:900}.student-name{text-align:center;color:var(--primary);font-size:30px;font-weight:900;margin:10px 0}
.problem{text-align:center;font-size:clamp(52px,11vw,84px);font-weight:900;margin:28px 0}.instruction{text-align:center;color:var(--muted);font-size:21px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:22px 0}.choice{min-height:110px;border:3px solid var(--line);border-radius:22px;background:#f9fcff;font-size:clamp(36px,8vw,54px);font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}.choice.selected{border-color:var(--primary)}
.drop{min-height:130px;border:4px dashed var(--primary);border-radius:23px;background:#eef6ff;display:flex;flex-direction:column;justify-content:center;align-items:center}.drop.over{background:#dbeeff}.drop-title{font-size:21px;font-weight:900}.drop-value{font-size:52px;font-weight:900;min-height:60px}.ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);padding:16px 30px;border:4px solid var(--primary);border-radius:20px;background:white;font-size:46px;font-weight:900}.finished{text-align:center}.finished h2{font-size:42px}.finished p{font-size:23px;color:var(--muted)}
@media(max-width:760px){.students{grid-template-columns:1fr}.result-row{grid-template-columns:1fr 1fr}.choices{gap:9px}}
</style></head><body><div class="wrap">
<header id="teacherHeader"><h1 id="title"></h1><div class="subtitle" id="subtitle"></div></header>
<section id="teacherHome"><div class="students"><button class="student" data-student="Janko">Janko<small>Ťukni pre QR kód</small></button><button class="student" data-student="Marienka">Marienka<small>Ťukni pre QR kód</small></button><button class="student" data-student="Zuzka">Zuzka<small>Ťukni pre QR kód</small></button></div><div class="teacher-actions"><button class="results-btn" id="resultsBtn">📊 Zobraziť výsledky</button><button class="home-btn" onclick="location.href='index.html'">← Všetky testy</button></div></section>
<section class="panel" id="qrPanel"><button class="back" id="backBtn">← Späť</button><div class="qr"><h2 id="qrName"></h2><p>Naskenuj QR kód tabletom.</p><img id="qrImage"><div class="url" id="studentUrl"></div></div></section>
<section class="panel" id="resultsPanel"><button class="back" id="resultsBackBtn">← Späť</button><h2>📊 Výsledky</h2><div class="result-status" id="resultsStatus"></div><div class="results-list" id="resultsList"></div><div class="actions"><button class="secondary" id="refreshResultsBtn">Obnoviť</button><button class="primary" id="resetResultsBtn">🗑️ Vynulovať výsledky</button></div></section>
<section class="panel" id="testPanel"><div class="test-header"><div class="progress-wrap"><div class="progress" id="progress"></div></div><div class="counter" id="counter"></div></div><div class="student-name" id="studentName"></div><div class="problem" id="problem"></div><div class="instruction">Presuň správnu odpoveď do poľa „Výsledok“ alebo na číslo ťukni.</div><div class="choices" id="choices"></div><div class="drop" id="drop"><div class="drop-title">Výsledok</div><div class="drop-value" id="dropValue">—</div></div><div class="actions"><button class="secondary" id="clearBtn">Vymazať</button><button class="primary" id="nextBtn" disabled>Potvrdiť odpoveď</button></div></section>
<section class="panel finished" id="finishedPanel"><h2>✅ Test je odovzdaný</h2><p id="thanks"></p></section></div>
<script>
const TESTS={"vstupny":{"title":"Vstupný test z matematiky","subtitle":"3. ročník ZŠ • Zmiešané príklady","questions":[{"text":"27 + 15 = ?","answer":42,"choices":[32,42,52]},{"text":"63 − 28 = ?","answer":35,"choices":[35,45,25]},{"text":"7 × 4 = ?","answer":28,"choices":[24,28,32]},{"text":"36 : 6 = ?","answer":6,"choices":[5,6,7]},{"text":"49 + 23 = ?","answer":72,"choices":[62,72,82]},{"text":"80 − 37 = ?","answer":43,"choices":[47,53,43]},{"text":"5 × 8 = ?","answer":40,"choices":[35,40,45]},{"text":"54 : 9 = ?","answer":6,"choices":[5,6,8]},{"text":"100 − 46 = ?","answer":54,"choices":[54,64,44]},{"text":"34 + 29 = ?","answer":63,"choices":[53,63,73]}]},"nasobenie":{"title":"Test z násobenia","subtitle":"3. ročník ZŠ • Malá násobilka","questions":[{"text":"2 × 4 = ?","answer":8,"choices":[6,8,10]},{"text":"3 × 5 = ?","answer":15,"choices":[12,15,18]},{"text":"4 × 6 = ?","answer":24,"choices":[20,24,28]},{"text":"5 × 7 = ?","answer":35,"choices":[30,35,40]},{"text":"6 × 8 = ?","answer":48,"choices":[42,48,54]},{"text":"7 × 3 = ?","answer":21,"choices":[18,21,24]},{"text":"8 × 4 = ?","answer":32,"choices":[28,32,36]},{"text":"9 × 5 = ?","answer":45,"choices":[40,45,50]},{"text":"6 × 6 = ?","answer":36,"choices":[30,36,42]},{"text":"7 × 8 = ?","answer":56,"choices":[49,56,63]}]}};
const params=new URLSearchParams(location.search);const TEST_ID=params.get("test")||"vstupny";const cfg=TESTS[TEST_ID]||TESTS.vstupny;const questions=cfg.questions;const STUDENTS=["Janko","Marienka","Zuzka"];const API="https://matematika-vysledky-api.herkuk9.workers.dev";
title.textContent="🧮 "+cfg.title;subtitle.textContent=cfg.subtitle;
const teacherHome=document.getElementById("teacherHome"),qrPanel=document.getElementById("qrPanel"),resultsPanel=document.getElementById("resultsPanel"),testPanel=document.getElementById("testPanel"),finishedPanel=document.getElementById("finishedPanel"),teacherHeader=document.getElementById("teacherHeader");
function hide(){[teacherHome,qrPanel,resultsPanel,testPanel,finishedPanel].forEach(x=>x.style.display="none")}function home(){hide();teacherHeader.style.display="block";teacherHome.style.display="block"}
function baseUrl(){const u=new URL(location.href);u.search="";u.searchParams.set("test",TEST_ID);return u.toString()}
function showQR(name){hide();qrPanel.style.display="block";const u=new URL(baseUrl());u.searchParams.set("student",name);qrName.textContent=name;studentUrl.textContent=u;qrImage.src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="+encodeURIComponent(u)}
document.querySelectorAll(".student").forEach(b=>b.onclick=()=>showQR(b.dataset.student));backBtn.onclick=home;resultsBackBtn.onclick=home;
async function loadResults(){hide();resultsPanel.style.display="block";resultsStatus.textContent="Načítavam…";resultsList.innerHTML="";try{const r=await fetch(API+"/results?testId="+encodeURIComponent(TEST_ID));const data=await r.json();resultsStatus.textContent="Aktuálne výsledky:";STUDENTS.forEach(n=>{const x=data[n],row=document.createElement("div");row.className="result-row";row.innerHTML=x?`<strong>${n}</strong><span>${x.score} / ${x.total}</span><span>${Math.round(x.score/x.total*100)} %</span>`:`<strong>${n}</strong><span>Neodovzdal/a</span><span>—</span>`;resultsList.appendChild(row)})}catch(e){resultsStatus.textContent="Výsledky sa nepodarilo načítať."}}
resultsBtn.onclick=loadResults;refreshResultsBtn.onclick=loadResults;resetResultsBtn.onclick=async()=>{const pin=prompt("Zadaj učiteľský PIN:");if(pin===null)return;if(!confirm("Naozaj vynulovať výsledky tohto testu?"))return;const r=await fetch(API+"/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pin,testId:TEST_ID})});if(r.status===403){alert("Nesprávny PIN.");return}await loadResults()};
let STUDENT=null,current=0,selected=null,answers=[],ghost=null,active=null;const choices=document.getElementById("choices"),drop=document.getElementById("drop"),dropValue=document.getElementById("dropValue"),nextBtn=document.getElementById("nextBtn");
function start(name){STUDENT=name;teacherHeader.style.display="none";hide();testPanel.style.display="block";studentName.textContent="Žiak: "+name;render()}function render(){selected=null;dropValue.textContent="—";nextBtn.disabled=true;counter.textContent=`${current+1} / ${questions.length}`;progress.style.width=`${current/questions.length*100}%`;problem.textContent=questions[current].text;choices.innerHTML="";questions[current].choices.forEach(v=>{const e=document.createElement("div");e.className="choice";e.textContent=v;e.dataset.value=v;e.onclick=()=>select(v,e);e.onpointerdown=drag;choices.appendChild(e)})}
function select(v,e){selected=Number(v);dropValue.textContent=selected;nextBtn.disabled=false;document.querySelectorAll(".choice").forEach(c=>c.classList.remove("selected"));e?.classList.add("selected")}
function drag(ev){ev.preventDefault();active=ev.pointerId;const el=ev.currentTarget,val=el.dataset.value;ghost=document.createElement("div");ghost.className="ghost";ghost.textContent=val;document.body.appendChild(ghost);move(ev);function move(e){if(e.pointerId!==active)return;ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";const r=drop.getBoundingClientRect();drop.classList.toggle("over",e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)}function end(e){if(e.pointerId!==active)return;const r=drop.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)select(val,el);drop.classList.remove("over");ghost.remove();document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",end)}document.addEventListener("pointermove",move,{passive:false});document.addEventListener("pointerup",end)}
clearBtn.onclick=()=>{selected=null;dropValue.textContent="—";nextBtn.disabled=true};nextBtn.onclick=async()=>{if(selected===null)return;const q=questions[current];answers.push({question:q.text,given:selected,correct:q.answer,isCorrect:selected===q.answer});current++;if(current<questions.length)return render();const score=answers.filter(a=>a.isCorrect).length;const r=await fetch(API+"/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({testId:TEST_ID,student:STUDENT,score,total:questions.length,answers,submittedAt:new Date().toISOString()})});if(!r.ok){current--;alert("Výsledok sa nepodarilo odoslať.");return}testPanel.style.display="none";finishedPanel.style.display="block";thanks.textContent=`Ďakujem, ${STUDENT}. Výsledok bol odoslaný: ${score} / ${questions.length}.`};
const requested=params.get("student");requested&&STUDENTS.includes(requested)?start(requested):home();
</script></body></html>

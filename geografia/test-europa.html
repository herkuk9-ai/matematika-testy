<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Hlavné mestá Európy</title><style>:root{--ink:#234b36;--muted:#5f7d6b;--primary:#2f8b57;--line:#cfe6d7;--bad:#b84b4b}*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(#eefaf3,#fbfffd);color:var(--ink)}.wrap{max-width:1100px;margin:auto}header,.panel{background:#fff;border-radius:26px;padding:26px;box-shadow:0 10px 28px rgba(35,75,54,.10);margin-bottom:20px}h1{margin:0;font-size:clamp(34px,5vw,50px)}.sub{color:var(--muted);font-size:20px;margin-top:8px}.students{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.student{min-height:160px;border:0;border-radius:24px;background:#fff;box-shadow:0 8px 24px rgba(35,75,54,.1);font-size:30px;font-weight:900;color:var(--ink)}.student small{display:block;font-size:16px;color:var(--muted);margin-top:10px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}button,.back{border:0;border-radius:16px;padding:16px 22px;font-size:18px;font-weight:900}.primary{background:var(--primary);color:#fff}.secondary,.back{background:#e3f3e9;color:var(--ink)}.panel{display:none}.qr{text-align:center}.qr h2{font-size:40px}.qr img{width:min(64vw,420px);padding:12px;background:#fff;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.12)}.url{font-size:14px;color:var(--muted);word-break:break-all}.student-name{text-align:center;font-size:26px;font-weight:900;color:var(--primary);margin-bottom:14px}.instruction{text-align:center;font-size:21px;color:var(--muted);margin-bottom:18px}.board{display:grid;grid-template-columns:1fr 1fr;gap:28px}.col-title{text-align:center;font-size:24px;font-weight:900;margin-bottom:12px}.list{display:grid;gap:14px}.city,.country{min-height:82px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:900}.city{background:#fff;border:3px solid var(--line);touch-action:none;user-select:none}.city.placed{opacity:.35}.country{background:#f5fbf7;border:3px dashed var(--primary);padding:10px;text-align:center;flex-direction:column}.country.over{background:#e4f6e9}.country.done{border-style:solid;background:#e9f8ee}.placed-label{font-size:16px;color:var(--muted);margin-top:5px}.ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);padding:14px 24px;border:3px solid var(--primary);border-radius:18px;background:#fff;font-size:24px;font-weight:900}.status{text-align:center;min-height:30px;font-size:18px;font-weight:800;margin-top:14px}.bad{color:var(--bad)}.good{color:var(--primary)}.finished{text-align:center}.score{font-size:54px;font-weight:900;color:var(--primary)}.results-list{display:grid;gap:12px}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;border:2px solid var(--line);padding:16px;border-radius:16px;font-size:19px;cursor:pointer}.detail{margin-top:18px;display:grid;gap:10px}.mistake{border:2px solid #efcaca;background:#fff7f7;padding:14px;border-radius:14px}.mistake strong{display:block;margin-bottom:6px}@media(max-width:760px){.students,.board{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><header><h1>🌍 Hlavné mestá Európy</h1><div class="sub">Potiahni hlavné mesto na správny štát.</div></header><section id="home"><div class="students"><button class="student" data-s="Janko">Janko<small>Ťukni pre QR kód</small></button><button class="student" data-s="Marienka">Marienka<small>Ťukni pre QR kód</small></button><button class="student" data-s="Zuzka">Zuzka<small>Ťukni pre QR kód</small></button></div><div class="actions"><button class="secondary" id="resultsBtn">📊 Výsledky</button><button class="secondary" onclick="location.href='index.html'">← Testy</button></div></section><section class="panel" id="qr"><button class="back" id="qrBack">← Späť</button><div class="qr"><h2 id="qrName"></h2><p>Naskenuj QR kód tabletom.</p><img id="qrImg"><div class="url" id="studentUrl"></div></div></section><section class="panel" id="test"><div class="student-name" id="studentName"></div><div class="instruction">Vľavo sú hlavné mestá. Potiahni ich na správny štát vpravo.</div><div class="board"><div><div class="col-title">Hlavné mestá</div><div class="list" id="cities"></div></div><div><div class="col-title">Štáty</div><div class="list" id="countries"></div></div></div><div class="status" id="status"></div></section><section class="panel finished" id="done"><h2>✅ Test je odovzdaný</h2><div class="score" id="score"></div><p id="thanks"></p></section><section class="panel" id="results"><button class="back" id="resultsBack">← Späť</button><h2>📊 Výsledky</h2><div class="results-list" id="resultsList"></div><div class="detail" id="detail"></div></section></div><script>const ITEMS=[{city:'Bratislava',country:'Slovensko'},{city:'Praha',country:'Česko'},{city:'Viedeň',country:'Rakúsko'},{city:'Budapešť',country:'Maďarsko'},{city:'Varšava',country:'Poľsko'}];const TEST_ID='geo-hlavne-mesta-1',API=location.origin,N=['Janko','Marienka','Zuzka'];const params=new URLSearchParams(location.search);let STUDENT=params.get('student'),answers=[],placed=0,firstTried={};const home=document.getElementById('home'),qr=document.getElementById('qr'),test=document.getElementById('test'),done=document.getElementById('done'),results=document.getElementById('results');function only(x){[home,qr,test,done,results].forEach(e=>e.style.display='none');x.style.display='block'}function baseUrl(){const u=new URL(location.href);u.search='';return u}function showQR(name){const u=baseUrl();u.searchParams.set('student',name);qrName.textContent=name;studentUrl.textContent=u;qrImg.src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(u);only(qr)}document.querySelectorAll('.student').forEach(b=>b.onclick=()=>showQR(b.dataset.s));qrBack.onclick=()=>only(home);function renderGame(){studentName.textContent='Žiak: '+STUDENT;cities.innerHTML='';countries.innerHTML='';ITEMS.forEach(it=>{const c=document.createElement('div');c.className='city';c.textContent=it.city;c.dataset.city=it.city;c.onpointerdown=startDrag;cities.appendChild(c);const d=document.createElement('div');d.className='country';d.dataset.country=it.country;d.innerHTML='<span>'+it.country+'</span><span class="placed-label"></span>';countries.appendChild(d)});only(test)}function startDrag(ev){const el=ev.currentTarget;if(el.classList.contains('placed'))return;ev.preventDefault();const city=el.dataset.city;const ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=city;document.body.appendChild(ghost);move(ev);function move(e){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.querySelectorAll('.country').forEach(t=>{const r=t.getBoundingClientRect();t.classList.toggle('over',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)})}async function end(e){let target=null;document.querySelectorAll('.country').forEach(t=>{const r=t.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)target=t;t.classList.remove('over')});ghost.remove();document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);if(!target||target.classList.contains('done'))return;const correct=ITEMS.find(x=>x.city===city).country;const ok=target.dataset.country===correct;if(!(city in firstTried)){firstTried[city]=true;answers.push({question:city,given:target.dataset.country,correct:correct,isCorrect:ok})}if(ok){el.classList.add('placed');target.classList.add('done');target.querySelector('.placed-label').textContent=city;placed++;status.className='status good';status.textContent='Správne.';if(placed===ITEMS.length)await finish()}else{status.className='status bad';status.textContent='To nie je správne. Skús znova.'}}document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',end)}async function finish(){const sc=answers.filter(a=>a.isCorrect).length;const r=await fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({testId:TEST_ID,student:STUDENT,score:sc,total:ITEMS.length,answers,submittedAt:new Date().toISOString()})});if(!r.ok){status.className='status bad';status.textContent='Výsledok sa nepodarilo odoslať.';return}score.textContent=sc+' / '+ITEMS.length;thanks.textContent='Ďakujem, '+STUDENT+'. Výsledok bol odoslaný.';only(done)}resultsBtn.onclick=async()=>{only(results);resultsList.textContent='Načítavam…';detail.innerHTML='';try{const r=await fetch(API+'/results?testId='+TEST_ID),d=await r.json();resultsList.innerHTML='';N.forEach(name=>{const v=d[name],row=document.createElement('div');row.className='row';row.innerHTML=v?'<strong>'+name+'</strong><span>'+v.score+' / '+v.total+'</span><span>'+Math.round(v.score/v.total*100)+' %</span>':'<strong>'+name+'</strong><span>Neodovzdal/a</span><span>—</span>';if(v)row.onclick=()=>showDetail(name,v);resultsList.appendChild(row)})}catch(e){resultsList.textContent='Výsledky sa nepodarilo načítať.'}};function showDetail(name,v){detail.innerHTML='<h3>Chyby – '+name+'</h3>';const bad=(v.answers||[]).filter(a=>!a.isCorrect);if(!bad.length){detail.innerHTML+='<div class="mistake">Bez chyby.</div>';return}bad.forEach(a=>{const e=document.createElement('div');e.className='mistake';e.innerHTML='<strong>'+a.question+'</strong>Žiak priradil: '+a.given+'<br>Správne: '+a.correct;detail.appendChild(e)})}resultsBack.onclick=()=>only(home);if(STUDENT&&N.includes(STUDENT))renderGame();else only(home);</script></body></html>

<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Štáty Európy</title><style>:root{--ink:#234b36;--muted:#5f7d6b;--primary:#2d8a58;--line:#cfe6d7;--bad:#b23a3a}*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(#eefaf3,#fbfffd);color:var(--ink)}.wrap{max-width:1200px;margin:auto}header,.panel{background:#fff;border-radius:26px;padding:26px;box-shadow:0 10px 28px rgba(35,75,54,.11);margin-bottom:20px}h1{margin:0;font-size:clamp(34px,5vw,52px)}.sub{color:var(--muted);font-size:20px;margin-top:8px}.students{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.student{min-height:160px;border:0;border-radius:24px;background:#fff;box-shadow:0 8px 24px rgba(35,75,54,.1);font-size:30px;font-weight:900;color:var(--ink)}.student small{display:block;font-size:16px;color:var(--muted);margin-top:10px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}button,.back{border:0;border-radius:16px;padding:16px 22px;font-size:18px;font-weight:900}.primary{background:var(--primary);color:#fff}.secondary,.back{background:#e3f3e9;color:var(--ink)}.panel{display:none}.qr{text-align:center}.qr h2{font-size:40px}.qr img{width:min(64vw,420px);padding:12px;background:#fff;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.13)}.url{word-break:break-all;color:var(--muted);font-size:14px}.student-name{text-align:center;font-size:28px;font-weight:900;color:var(--primary);margin-bottom:12px}.instruction{text-align:center;color:var(--muted);font-size:20px;margin-bottom:16px}.test-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:20px;align-items:start}.map-wrap{position:relative;border:3px solid var(--line);border-radius:22px;overflow:hidden;background:#bff2f3;touch-action:none}.map-wrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.placed{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--primary);border-radius:12px;padding:5px 9px;font-size:14px;font-weight:900;box-shadow:0 2px 7px rgba(0,0,0,.16);pointer-events:none;white-space:nowrap}.bank{background:#f7fcf9;border:2px solid var(--line);border-radius:22px;padding:16px;min-height:300px}.bank h3{margin:0 0 12px}.chip{background:#fff;border:3px solid var(--line);border-radius:15px;padding:14px 10px;margin:10px 0;font-size:19px;font-weight:900;text-align:center;touch-action:none;user-select:none}.chip.dragging{opacity:.35}.ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);padding:13px 18px;border:3px solid var(--primary);border-radius:15px;background:#fff;font-size:19px;font-weight:900;box-shadow:0 5px 16px rgba(0,0,0,.18)}.feedback{min-height:28px;text-align:center;font-size:20px;font-weight:900;margin-top:14px}.feedback.bad{color:var(--bad)}.feedback.good{color:var(--primary)}.progress{height:18px;background:#e2f0e7;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--primary)}.counter{text-align:right;font-weight:900;margin-top:8px}.finished{text-align:center}.finished h2{font-size:40px}.score{font-size:54px;font-weight:900;color:var(--primary)}.results-list{display:grid;gap:12px}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;border:2px solid var(--line);padding:16px;border-radius:16px;font-size:19px;cursor:pointer}.detail{display:none;margin-top:10px;padding:14px;border-radius:14px;background:#f8fcf9}.mistake{padding:10px 0;border-bottom:1px solid var(--line)}@media(max-width:850px){.students{grid-template-columns:1fr}.test-layout{grid-template-columns:1fr}.bank{min-height:0}.chip{display:inline-block;margin:6px;width:auto;min-width:130px}.row{grid-template-columns:1.4fr 1fr}}</style></head><body><div class="wrap"><header id="header"><h1>🌍 Štáty Európy</h1><div class="sub">Potiahni názov štátu na správne miesto na mape.</div></header><section id="home"><div class="students"><button class="student" data-s="Janko">Janko<small>Ťukni pre QR kód</small></button><button class="student" data-s="Marienka">Marienka<small>Ťukni pre QR kód</small></button><button class="student" data-s="Zuzka">Zuzka<small>Ťukni pre QR kód</small></button></div><div class="actions"><button class="secondary" id="resultsBtn">📊 Výsledky</button><button class="secondary" onclick="location.href='index.html'">← Testy</button></div></section><section class="panel" id="qr"><button class="back" id="qrBack">← Späť</button><div class="qr"><h2 id="qrName"></h2><p>Naskenuj QR kód tabletom.</p><img id="qrImg"><div class="url" id="qrUrl"></div></div></section><section class="panel" id="test"><div class="progress"><div class="bar" id="bar"></div></div><div class="counter" id="counter"></div><div class="student-name" id="studentName"></div><div class="instruction">Presuň každý názov štátu na jeho územie. Po nesprávnom pokuse môžeš skúsiť znova.</div><div class="test-layout"><div><div class="map-wrap" id="map"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Europe_blank_map.svg/960px-Europe_blank_map.svg.png" alt="Slepá mapa Európy"></div><div class="feedback" id="feedback"></div></div><div class="bank"><h3>Štáty</h3><div id="chips"></div></div></div></section><section class="panel finished" id="done"><h2>✅ Test je hotový</h2><div class="score" id="score"></div><p id="thanks"></p><div class="actions"><button class="secondary" onclick="location.href='index.html'">Späť na testy</button></div></section><section class="panel" id="results"><button class="back" id="resultsBack">← Späť</button><h2>📊 Výsledky</h2><div class="results-list" id="resultsList"></div></section></div><script>const API=location.origin,TEST_ID='geo-europa-staty-1',STUDENTS=['Janko','Marienka','Zuzka'];const COUNTRIES=[{n:'Portugalsko',x:21.5,y:75.5},{n:'Španielsko',x:28.5,y:74.2},{n:'Francúzsko',x:33.0,y:63.5},{n:'Nemecko',x:44.0,y:57.7},{n:'Taliansko',x:49.3,y:71.2},{n:'Poľsko',x:54.9,y:57.8},{n:'Švédsko',x:56.1,y:34.5},{n:'Grécko',x:61.2,y:76.0},{n:'Rumunsko',x:63.4,y:65.4},{n:'Slovensko',x:54.2,y:62.2}];const home=document.getElementById('home'),qr=document.getElementById('qr'),test=document.getElementById('test'),done=document.getElementById('done'),results=document.getElementById('results'),map=document.getElementById('map'),chips=document.getElementById('chips');let student=null,placed=0,answers=[],firstAttempts={},ghost=null,activeChip=null;function only(x){[home,qr,test,done,results].forEach(e=>e.style.display='none');x.style.display='block'}function shuffled(a){return [...a].sort(()=>Math.random()-.5)}function baseStudentUrl(name){const u=new URL(location.href);u.search='';u.searchParams.set('student',name);return u.toString()}document.querySelectorAll('.student').forEach(b=>b.onclick=()=>{const n=b.dataset.s,u=baseStudentUrl(n);qrName.textContent=n;qrUrl.textContent=u;qrImg.src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(u);only(qr)});qrBack.onclick=()=>only(home);resultsBack.onclick=()=>only(home);function start(n){student=n;placed=0;answers=[];firstAttempts={};studentName.textContent='Žiak: '+n;chips.innerHTML='';map.querySelectorAll('.placed').forEach(e=>e.remove());feedback.textContent='';shuffled(COUNTRIES).forEach(c=>{const d=document.createElement('div');d.className='chip';d.textContent=c.n;d.dataset.name=c.n;d.onpointerdown=startDrag;chips.appendChild(d)});updateProgress();only(test)}function updateProgress(){bar.style.width=(placed/COUNTRIES.length*100)+'%';counter.textContent=placed+' / '+COUNTRIES.length}function startDrag(ev){ev.preventDefault();activeChip=ev.currentTarget;activeChip.classList.add('dragging');ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=activeChip.dataset.name;document.body.appendChild(ghost);move(ev);function move(e){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}async function end(e){document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);activeChip.classList.remove('dragging');const r=map.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){const x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;attempt(activeChip,x,y)}ghost.remove();ghost=null;activeChip=null}document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',end,{once:true})}function attempt(chip,x,y){const c=COUNTRIES.find(q=>q.n===chip.dataset.name);const dx=(x-c.x),dy=(y-c.y);const ok=Math.sqrt(dx*dx+dy*dy)<5.2;if(firstAttempts[c.n]===undefined){firstAttempts[c.n]=ok;answers.push({question:'Umiestni štát: '+c.n,given:ok?'správne miesto':'nesprávne miesto',correct:c.n,isCorrect:ok})}if(ok){const lab=document.createElement('div');lab.className='placed';lab.textContent=c.n;lab.style.left=c.x+'%';lab.style.top=c.y+'%';map.appendChild(lab);chip.remove();placed++;feedback.className='feedback good';feedback.textContent='Správne!';updateProgress();if(placed===COUNTRIES.length)setTimeout(finish,300)}else{feedback.className='feedback bad';feedback.textContent='To nie je správne miesto. Skús ešte raz.'}}async function finish(){const sc=answers.filter(a=>a.isCorrect).length;const r=await fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({testId:TEST_ID,student,score:sc,total:COUNTRIES.length,answers,submittedAt:new Date().toISOString()})});if(!r.ok){alert('Výsledok sa nepodarilo odoslať.');return}score.textContent=sc+' / '+COUNTRIES.length;thanks.textContent='Ďakujem, '+student+'. Výsledok bol odoslaný.';only(done)}resultsBtn.onclick=async()=>{only(results);resultsList.innerHTML='Načítavam…';try{const r=await fetch(API+'/results?testId='+TEST_ID),data=await r.json();resultsList.innerHTML='';STUDENTS.forEach(n=>{const v=data[n],wrap=document.createElement('div'),row=document.createElement('div');row.className='row';row.innerHTML=v?'<strong>'+n+'</strong><span>'+v.score+' / '+v.total+'</span><span>'+Math.round(v.score/v.total*100)+' %</span>':'<strong>'+n+'</strong><span>Neodovzdal/a</span><span>—</span>';wrap.appendChild(row);if(v){const det=document.createElement('div');det.className='detail';const bad=(v.answers||[]).filter(a=>!a.isCorrect);det.innerHTML=bad.length?bad.map(a=>'<div class="mistake"><strong>'+a.question+'</strong><br>Prvý pokus: nesprávne miesto</div>').join(''):'<strong>✅ Bez chyby.</strong>';row.onclick=()=>det.style.display=det.style.display==='block'?'none':'block';wrap.appendChild(det)}resultsList.appendChild(wrap)})}catch(e){resultsList.textContent='Výsledky sa nepodarilo načítať.'}};const p=new URLSearchParams(location.search),requested=p.get('student');requested&&STUDENTS.includes(requested)?start(requested):only(home);</script></body></html>

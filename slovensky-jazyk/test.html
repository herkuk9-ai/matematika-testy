<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Doplň i/y</title><style>:root{--ink:#5a351d;--muted:#806650;--primary:#c56a24;--line:#ead2bd}*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(#fff8ef,#fffdf9);color:var(--ink)}.wrap{max-width:1000px;margin:auto}header,.panel{background:#fff;border-radius:26px;padding:26px;box-shadow:0 10px 28px rgba(120,76,34,.1);margin-bottom:20px}h1{margin:0;font-size:clamp(34px,5vw,50px)}.sub{color:var(--muted);font-size:20px;margin-top:8px}.students{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.student{min-height:160px;border:0;border-radius:24px;background:#fff;box-shadow:0 8px 24px rgba(120,76,34,.1);font-size:30px;font-weight:900;color:var(--ink)}.student small{display:block;font-size:16px;color:var(--muted);margin-top:10px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}button,.back{border:0;border-radius:16px;padding:16px 22px;font-size:18px;font-weight:900}.primary{background:var(--primary);color:white}.secondary,.back{background:#f7eadc;color:var(--ink)}.panel{display:none}.word{text-align:center;font-size:clamp(52px,11vw,88px);font-weight:900;margin:42px 0}.hint{text-align:center;font-size:21px;color:var(--muted)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:600px;margin:30px auto}.choice{min-height:120px;border:3px solid var(--line);border-radius:22px;background:#fffaf5;font-size:60px;font-weight:900}.choice.selected{border-color:var(--primary);background:#fff1e5}.progress{height:18px;background:#f3e6da;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--primary)}.counter{text-align:right;font-weight:900;margin-top:8px}.finished{text-align:center}.finished h2{font-size:40px}.score{font-size:54px;font-weight:900;color:var(--primary)}.results{display:grid;gap:12px}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;border:2px solid var(--line);padding:16px;border-radius:16px;font-size:19px}@media(max-width:700px){.students{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><h1>✍️ Doplň i / y</h1><div class="sub">Vyber správne písmeno do slova.</div></header><section id="home"><div class="students"><button class="student" data-s="Janko">Janko<small>Ťukni a spusti test</small></button><button class="student" data-s="Marienka">Marienka<small>Ťukni a spusti test</small></button><button class="student" data-s="Zuzka">Zuzka<small>Ťukni a spusti test</small></button></div><div class="actions"><button class="secondary" id="resultsBtn">📊 Výsledky</button><button class="secondary" onclick="location.href='index.html'">← Testy</button></div></section><section class="panel" id="test"><div class="progress"><div class="bar" id="bar"></div></div><div class="counter" id="counter"></div><div class="hint" id="student"></div><div class="word" id="word"></div><div class="hint">Doplň správne písmeno.</div><div class="choices"><button class="choice" data-v="i">i</button><button class="choice" data-v="y">y</button></div><div class="actions"><button class="secondary" id="clear">Vymazať</button><button class="primary" id="next" disabled>Potvrdiť</button></div></section><section class="panel finished" id="done"><h2>✅ Test je hotový</h2><div class="score" id="score"></div><p id="thanks"></p><div class="actions"><button class="secondary" onclick="location.reload()">Späť</button></div></section><section class="panel" id="results"><button class="back" id="back">← Späť</button><h2>📊 Výsledky</h2><div class="results" id="list"></div></section></div><script>const Q=[['r_ba','y'],['s_r','y'],['m_š','y'],['l_ška','y'],['b_cykel','i'],['p_vo','i'],['z_ma','i'],['t_cho','i'],['v_soký','y'],['r_chlý','ý']];Q[9]=['r_chl_','y'];const TEST_ID='sj-iy-1',API=location.origin,N=['Janko','Marienka','Zuzka'];let s=null,n=0,sel=null,a=[];const home=document.getElementById('home'),test=document.getElementById('test'),done=document.getElementById('done'),results=document.getElementById('results');function only(x){[home,test,done,results].forEach(e=>e.style.display='none');x.style.display='block'}function render(){sel=null;next.disabled=true;document.querySelectorAll('.choice').forEach(e=>e.classList.remove('selected'));word.textContent=Q[n][0];counter.textContent=(n+1)+' / '+Q.length;bar.style.width=(n/Q.length*100)+'%';student.textContent='Žiak: '+s}document.querySelectorAll('.student').forEach(b=>b.onclick=()=>{s=b.dataset.s;n=0;a=[];only(test);render()});document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{sel=b.dataset.v;document.querySelectorAll('.choice').forEach(e=>e.classList.remove('selected'));b.classList.add('selected');next.disabled=false});clear.onclick=()=>{sel=null;next.disabled=true;document.querySelectorAll('.choice').forEach(e=>e.classList.remove('selected'))};next.onclick=async()=>{a.push({question:Q[n][0],given:sel,correct:Q[n][1],isCorrect:sel===Q[n][1]});n++;if(n<Q.length)return render();let sc=a.filter(x=>x.isCorrect).length;const r=await fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({testId:TEST_ID,student:s,score:sc,total:Q.length,answers:a,submittedAt:new Date().toISOString()})});if(!r.ok){alert('Výsledok sa nepodarilo odoslať.');return}score.textContent=sc+' / '+Q.length;thanks.textContent='Ďakujem, '+s+'. Výsledok bol odoslaný.';only(done)};resultsBtn.onclick=async()=>{only(results);list.innerHTML='Načítavam…';try{const r=await fetch(API+'/results?testId='+TEST_ID),d=await r.json();list.innerHTML='';N.forEach(x=>{const v=d[x],e=document.createElement('div');e.className='row';e.innerHTML=v?'<strong>'+x+'</strong><span>'+v.score+' / '+v.total+'</span><span>'+Math.round(v.score/v.total*100)+' %</span>':'<strong>'+x+'</strong><span>Neodovzdal/a</span><span>—</span>';list.appendChild(e)})}catch(e){list.textContent='Výsledky sa nepodarilo načítať.'}};back.onclick=()=>only(home);</script></body></html>

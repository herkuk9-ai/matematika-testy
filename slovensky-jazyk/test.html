<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Doplň i/y</title><style>:root{--ink:#5a351d;--muted:#806650;--primary:#c56a24;--line:#ead2bd}*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(#fff8ef,#fffdf9);color:var(--ink)}.wrap{max-width:1000px;margin:auto}header,.panel{background:#fff;border-radius:26px;padding:26px;box-shadow:0 10px 28px rgba(120,76,34,.1);margin-bottom:20px}h1{margin:0;font-size:clamp(34px,5vw,50px)}.sub{color:var(--muted);font-size:20px;margin-top:8px}.students{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.student{min-height:160px;border:0;border-radius:24px;background:#fff;box-shadow:0 8px 24px rgba(120,76,34,.1);font-size:30px;font-weight:900;color:var(--ink)}.student small{display:block;font-size:16px;color:var(--muted);margin-top:10px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}button,.back{border:0;border-radius:16px;padding:16px 22px;font-size:18px;font-weight:900}.primary{background:var(--primary);color:white}.secondary,.back{background:#f7eadc;color:var(--ink)}.panel{display:none}.qr{text-align:center}.qr h2{font-size:40px}.qr p{font-size:20px;color:var(--muted)}.qr img{width:min(62vw,420px);padding:12px;background:white;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.13)}.url{word-break:break-all;color:var(--muted);font-size:14px;margin-top:10px}.word{text-align:center;font-size:clamp(52px,11vw,88px);font-weight:900;margin:42px 0}.hint{text-align:center;font-size:21px;color:var(--muted)}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:600px;margin:30px auto}.choice{min-height:120px;border:3px solid var(--line);border-radius:22px;background:#fffaf5;font-size:60px;font-weight:900}.choice.selected{border-color:var(--primary);background:#fff1e5}.progress{height:18px;background:#f3e6da;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--primary)}.counter{text-align:right;font-weight:900;margin-top:8px}.finished{text-align:center}.finished h2{font-size:40px}.score{font-size:54px;font-weight:900;color:var(--primary)}.results{display:grid;gap:12px}.row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;border:2px solid var(--line);padding:16px;border-radius:16px;font-size:19px}@media(max-width:700px){.students{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header id="header"><h1>✍️ Doplň i / y</h1><div class="sub">Doplň do každého slova práve jedno správne písmeno.</div></header><section id="home"><div class="students"><button class="student" data-s="Janko">Janko<small>Ťukni pre QR kód</small></button><button class="student" data-s="Marienka">Marienka<small>Ťukni pre QR kód</small></button><button class="student" data-s="Zuzka">Zuzka<small>Ťukni pre QR kód</small></button></div><div class="actions"><button class="secondary" id="resultsBtn">📊 Výsledky</button><button class="secondary" onclick="location.href='index.html'">← Testy</button></div></section><section class="panel" id="qr"><button class="back" id="qrBack">← Späť</button><div class="qr"><h2 id="qrName"></h2><p>Naskenuj QR kód tabletom.</p><img id="qrImage"><div class="url" id="studentUrl"></div></div></section><section class="panel" id="test"><div class="progress"><div class="bar" id="bar"></div></div><div class="counter" id="counter"></div><div class="hint" id="student"></div><div class="word" id="word"></div><div class="hint">Doplň správne písmeno.</div><div class="choices" id="choices"></div><div class="actions"><button class="secondary" id="clear">Vymazať</button><button class="primary" id="next" disabled>Potvrdiť</button></div></section><section class="panel finished" id="done"><h2>✅ Test je hotový</h2><div class="score" id="score"></div><p id="thanks"></p><div class="actions"><button class="secondary" onclick="location.href='test.html'">Späť</button></div></section><section class="panel" id="results"><button class="back" id="back">← Späť</button><h2>📊 Výsledky</h2><div class="results" id="list"></div></section></div><script>const Q=[{word:'r_ba',answer:'y',options:['i','y']},{word:'s_r',answer:'y',options:['i','y']},{word:'m_š',answer:'y',options:['i','y']},{word:'l_že',answer:'y',options:['i','y']},{word:'b_cykel',answer:'i',options:['i','y']},{word:'p_vo',answer:'i',options:['i','y']},{word:'z_ma',answer:'i',options:['i','y']},{word:'t_cho',answer:'i',options:['i','y']},{word:'b_k',answer:'ý',options:['í','ý']},{word:'p_sať',answer:'í',options:['í','ý']}];const TEST_ID='sj-iy-1',API=location.origin,N=['Janko','Marienka','Zuzka'];const params=new URLSearchParams(location.search);let s=params.get('student'),n=0,sel=null,a=[];const home=document.getElementById('home'),qr=document.getElementById('qr'),test=document.getElementById('test'),done=document.getElementById('done'),results=document.getElementById('results'),choices=document.getElementById('choices');function only(x){[home,qr,test,done,results].forEach(e=>e.style.display='none');x.style.display='block'}function baseUrl(){const u=new URL(location.href);u.search='';return u.toString()}function showQR(name){const u=new URL(baseUrl());u.searchParams.set('student',name);qrName.textContent=name;studentUrl.textContent=u;qrImage.src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(u);only(qr)}function render(){sel=null;next.disabled=true;word.textContent=Q[n].word;counter.textContent=(n+1)+' / '+Q.length;bar.style.width=(n/Q.length*100)+'%';student.textContent='Žiak: '+s;choices.innerHTML='';Q[n].options.forEach(v=>{const b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{sel=v;document.querySelectorAll('.choice').forEach(e=>e.classList.remove('selected'));b.classList.add('selected');next.disabled=false};choices.appendChild(b)})}function start(name){s=name;n=0;sel=null;a=[];only(test);render()}document.querySelectorAll('.student').forEach(b=>b.onclick=()=>showQR(b.dataset.s));qrBack.onclick=()=>only(home);clear.onclick=()=>{sel=null;next.disabled=true;document.querySelectorAll('.choice').forEach(e=>e.classList.remove('selected'))};next.onclick=async()=>{a.push({question:Q[n].word,given:sel,correct:Q[n].answer,isCorrect:sel===Q[n].answer});n++;if(n<Q.length)return render();let sc=a.filter(x=>x.isCorrect).length;const r=await fetch(API+'/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({testId:TEST_ID,student:s,score:sc,total:Q.length,answers:a,submittedAt:new Date().toISOString()})});if(!r.ok){alert('Výsledok sa nepodarilo odoslať.');return}score.textContent=sc+' / '+Q.length;thanks.textContent='Ďakujem, '+s+'. Výsledok bol odoslaný.';only(done)};resultsBtn.onclick=async()=>{only(results);list.innerHTML='Načítavam…';try{const r=await fetch(API+'/results?testId='+TEST_ID),d=await r.json();list.innerHTML='';N.forEach(x=>{const v=d[x],e=document.createElement('div');e.className='row';e.innerHTML=v?'<strong>'+x+'</strong><span>'+v.score+' / '+v.total+'</span><span>'+Math.round(v.score/v.total*100)+' %</span>':'<strong>'+x+'</strong><span>Neodovzdal/a</span><span>—</span>';list.appendChild(e)})}catch(e){list.textContent='Výsledky sa nepodarilo načítať.'}};back.onclick=()=>only(home);if(s&&N.includes(s))start(s);else only(home);</script></body></html>
